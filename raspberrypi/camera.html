<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Camera debug</title>
<style>
:root{color-scheme:dark;font:16px system-ui;background:#10151b;color:#e9efef}*{box-sizing:border-box}body{max-width:1160px;margin:auto;padding:32px 24px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}h1{font-size:32px;margin:4px 0}h2{font-size:18px;margin:0 0 20px}.eyebrow{color:#99ccb9;font-size:12px;letter-spacing:2px;text-transform:uppercase}.muted,small{color:#9aaab2}small{display:block;margin-top:8px;line-height:1.5}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.card{background:#192129;border:1px solid #2c3b43;border-radius:16px;padding:24px}.wide{grid-column:1/-1}.status{font-size:25px;margin:8px 0}.pill{border:1px solid #426457;color:#a4e8c9;padding:6px 12px;border-radius:30px;font-size:13px}button,input,select{font:inherit}button{border:1px solid #40525e;border-radius:8px;background:#283944;color:#fff;padding:11px 16px;cursor:pointer}button:hover{background:#344e5d}button.primary{background:#a4e8c9;color:#11251e;border-color:#a4e8c9;font-weight:650}button.stop{background:#472b32;border-color:#85515b;color:#ffd6db}button:disabled{opacity:.4;cursor:default}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}label{display:block;margin:16px 0 7px}input[type=number],input[type=text],input[type=password],select{background:#101820;border:1px solid #43545d;border-radius:7px;color:white;padding:9px;width:100%}input[type=range]{width:100%;accent-color:#a4e8c9}input[type=checkbox]{accent-color:#a4e8c9}.fieldrow{display:grid;grid-template-columns:1fr 1fr;gap:16px}.clip{display:flex;align-items:center;gap:10px;border-bottom:1px solid #2c3b43;padding:10px 0;margin:0}.clip span{flex:1}.clip button{padding:6px 10px;font-size:13px}pre{white-space:pre-wrap;word-break:break-word;font:12px/1.6 ui-monospace,monospace;height:200px;overflow:auto;color:#c1d3dc;margin:0}#message{min-height:25px;padding:10px 0;color:#ffd39e}#login{max-width:450px;margin:65px auto}#login button{margin-top:16px}footer{margin:22px 0;color:#80939d;font-size:12px}@media(max-width:700px){.grid{grid-template-columns:1fr}body{padding:20px 14px}.card{padding:20px}header{align-items:flex-start}.fieldrow{grid-template-columns:1fr}}
[hidden]{display:none!important}
</style></head><body>
<header><h1>Camera debug</h1><span id="connection" class="pill">Disconnected</span></header><nav class="row" style="margin-bottom:20px"><a href="/" style="color:#a4e8c9">Home</a><a href="/camera" style="color:#a4e8c9">Camera debug</a><button id="logout" hidden>Sign out</button></nav>
<form id="login" class="card" method="post" autocomplete="on"><h2>Sign in</h2><label for="username">Username</label><input id="username" name="username" type="text" autocomplete="username" value="admin" required><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required><button class="primary" id="connect" type="submit">Sign in</button></form>
<div id="message" role="status" aria-live="polite"></div>
<main id="main" hidden><section class="card wide"><h2>Live image</h2><label for="rtsp">RTSP URL</label><input id="rtsp" type="password" autocomplete="off" placeholder="rtsp://..."><small id="sourceState">Enter once to save on the Pi. Leave blank to reuse; enter a new URL to replace it.</small><label for="detector">Detection</label><select id="detector"><option value="capture">Capture only</option><option value="person">Full body</option><option value="face">Face</option></select><label for="cameraSeconds">Duration (seconds)</label><input id="cameraSeconds" type="number" min="5" max="3600" value="60"><div class="row" style="margin-top:16px"><button id="cameraStart">Start camera test</button><button id="cameraStop" disabled>Stop camera test</button><span id="cameraState">Stopped</span></div><small>Tracking does not control the head. Detection adds load on the Pi.</small><img id="cameraPreview" alt="Annotated camera test" hidden style="display:block;max-width:100%;margin-top:16px"><small id="frameState"></small><pre id="cameraLogs"></pre></section></main><script>
const $=id=>document.getElementById(id);
let password='',username='admin',busy=false,previewBusy=false,running=false,previewUrl;
function headers(){return password?{Authorization:'Basic '+btoa(username+':'+password)}:{}}
async function api(path,data){const r=await fetch('/api/'+path,{method:data?'POST':'GET',headers:{...headers(),...(data?{'Content-Type':'application/json'}:{})},body:data?JSON.stringify(data):undefined});const result=await r.json();if(!r.ok){const e=Error(result.error||'Request failed');e.status=r.status;throw e}return result}
async function poll(){if(busy)return;busy=true;try{const s=await api('camera/status');running=s.running;$("rtsp").placeholder=s.configured?"Saved on Pi (leave blank to reuse)":"rtsp://...";$('connection').textContent='Connected';$('login').hidden=true;$('logout').hidden=false;$('main').hidden=false;$('cameraState').textContent=running?'Running':'Stopped';$('cameraStart').disabled=running;$('cameraStop').disabled=!running;$('cameraLogs').textContent=s.logs.join('\n');if(!running&&s.preview)await frame();if(!s.preview)$('cameraPreview').hidden=true}catch(e){running=false;$('connection').textContent='Disconnected';if(e.status===401){$('login').hidden=false;$('main').hidden=true;$('logout').hidden=true}else $('message').textContent=e.message}finally{busy=false}}
async function frame(){if(previewBusy||document.hidden)return;previewBusy=true;try{const r=await fetch('/api/camera/preview',{headers:headers(),signal:AbortSignal.timeout(5000)});if(r.ok){const next=URL.createObjectURL(await r.blob());$('cameraPreview').src=next;$('cameraPreview').hidden=false;if(previewUrl)URL.revokeObjectURL(previewUrl);previewUrl=next;$('frameState').textContent='Last frame received: '+new Date().toLocaleTimeString()}else if(r.status===404){$('cameraPreview').hidden=true;$('frameState').textContent='Waiting for camera frames'}}catch(e){$('frameState').textContent='Image feed unavailable'}finally{previewBusy=false}}
async function command(path,data){try{await api(path,data);$('message').textContent='';if(path==='camera/start'){$('rtsp').value='';$('cameraPreview').hidden=true;$('frameState').textContent='Connecting to camera...'}await poll()}catch(e){$('message').textContent=e.message}}
$('login').onsubmit=async e=>{e.preventDefault();username=$('username').value;password=$('password').value;try{await api('login',{});password='';$('message').textContent='';await poll()}catch(e){$('message').textContent=e.message}finally{password=''}};
$('logout').onclick=async()=>{await api('logout',{});location.reload()};
$('cameraStart').onclick=()=>command('camera/start',{url:$('rtsp').value,detector:$('detector').value,seconds:+$('cameraSeconds').value});
$('cameraStop').onclick=()=>command('camera/stop',{});
poll();setInterval(poll,1500);setInterval(()=>{if(running)frame()},200);
</script></body></html>
